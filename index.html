<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بكم</title>
  <style>
    /* تنسيق الخلفية وتوسيط النص */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #2d2b55);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden; /* لمنع شريط التمرير أثناء تساقط القلوب */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* نص الترحيب */
    .welcome-text {
      color: #ffffff;
      font-size: 3.5rem;
      font-weight: bold;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      z-index: 10;
      text-align: center;
      animation: fadeIn 2s ease-in-out;
    }

    /* ظهور النص بنعومة */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* تنسيق القلوب */
    .heart {
      position: absolute;
      top: -50px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    /* حركية التساقط والدوران */
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.2;
      }
    }
  </style>
</head>
<body>

  <h1 class="welcome-text">مرحباً بكم في عالمنا ✨</h1>

  <script>
    // مصفوفة من الألوان الزاهية للقلوب
    const colors = ['#ff4b5c', '#ff75a0', '#ce93d8', '#ffb74d', '#4dd0e1', '#81c784', '#ff4081'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';

      // اختيار موقع عشوائي أفقيًا
      heart.style.left = Math.random() * 100 + 'vw';

      // اختيار حجم عشوائي للقلب
      const size = Math.random() * 20 + 15; // بين 15px و 35px
      heart.style.fontSize = size + 'px';

      // اختيار لون عشوائي
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      heart.style.color = randomColor;

      // اختيار سرعة تساقط عشوائية
      const duration = Math.random() * 3 + 2; // بين 2 إلى 5 ثوانٍ
      heart.style.animationDuration = duration + 's';

      document.body.appendChild(heart);

      // حذف القلب بعد انتهاء أنيميشن التساقط للحفاظ على أداء الصفحة
      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    // إنشاء قلب جديد كل 200 مللي ثانية
    setInterval(createHeart, 200);
  </script>

</body>
</html>
