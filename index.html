<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هدية محمود</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .envelope-icon {
            font-size: 80px;
            cursor: pointer;
            transition: transform 0.2s;
            display: inline-block;
        }
        .envelope-icon:hover {
            transform: scale(1.1);
        }
        .hidden {
            display: none;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 18px;
            text-align: center;
            outline: none;
        }
        input[type="password"]:focus {
            border-color: #007bff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0056b3;
        }
        .error {
            color: red;
            margin-top: 10px;
            font-weight: bold;
        }
        .final-message {
            font-size: 24px;
            color: #d9534f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- الخطوة الأولى: الظرف -->
        <div id="step-envelope">
            <div class="envelope-icon" onclick="openEnvelope()">✉️</div>
            <h2>افتح هدية محمود يا عمر</h2>
        </div>

        <!-- الخطوة الثانية: أدخل كلمة السر -->
        <div id="step-password" class="hidden">
            <h3>أدخل الباسورد للفتح</h3>
            <input type="password" id="passwordInput" placeholder="****">
            <button onclick="checkPassword()">تأكيد</button>
            <div id="errorMessage" class="error"></div>
        </div>

        <!-- الخطوة الثالثة: الرسالة النهائية -->
        <div id="step-final" class="hidden">
            <div class="final-message">شوف حد ينيكك</div>
        </div>
    </div>

    <script>
        // فتح الظرف والانتقال لصفحة الباسورد
        function openEnvelope() {
            document.getElementById('step-envelope').classList.add('hidden');
            document.getElementById('step-password').classList.remove('hidden');
        }

        // التحقق من صحة كلمة السر
        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('errorMessage');

            if (password === '2222') {
                document.getElementById('step-password').classList.add('hidden');
                document.getElementById('step-final').classList.remove('hidden');
            } else {
                errorDiv.innerText = 'غلط!';
            }
        }
    </script>

</body>
</html>
