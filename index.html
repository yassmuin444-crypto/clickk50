<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحباً بكم - لعبة الطائرة</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e1b4b);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
    }

    /* الشاشة الرئيسية */
    .welcome-container {
      text-align: center;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    .welcome-text {
      font-size: 3.5rem;
      font-weight: bold;
      text-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }

    .play-btn {
      background: linear-gradient(45deg, #ff4081, #ff75a0);
      color: white;
      border: none;
      padding: 15px 40px;
      font-size: 1.8rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(255, 64, 129, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .play-btn:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(255, 64, 129, 0.6);
    }

    /* تساقط القلوب */
    .heart {
      position: absolute;
      top: -50px;
      user-select: none;
      pointer-events: none;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0.2; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* شاشة اللعبة */
    #game-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* شريط التحكم العلوي */
    .game-ui {
      position: absolute;
      top: 20px;
      left: 5%;
      width: 90%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      font-size: 1.2rem;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      border-radius: 15px;
      backdrop-filter: blur(10px);
      box-sizing: border-box;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* منصة الطائرة */
    .canvas-container {
      position: absolute;
      top: 100px;
      left: 5%;
      width: 90%;
      height: 60vh;
      background: rgba(15, 23, 42, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .multiplier-display {
      font-size: 5rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
      z-index: 10;
    }

    .plane {
      position: absolute;
      font-size: 4rem;
      bottom: 20px;
      left: 20px;
      transition: all 0.1s linear;
      z-index: 5;
    }

    /* أزرار اللعبة السفلية */
    .controls-panel {
      position: absolute;
      bottom: 30px;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 20px;
      z-index: 20;
    }

    .action-btn {
      padding: 15px 40px;
      font-size: 1.5rem;
      font-weight: bold;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: white;
    }

    .btn-start { background: #10b981; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }
    .btn-cashout { background: #f59e0b; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4); display: none; }
    .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg {
      position: absolute;
      top: 20%;
      font-size: 2rem;
      font-weight: bold;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- الشاشة الرئيسية -->
  <div class="welcome-container" id="welcome-screen">
    <h1 class="welcome-text">مرحباً بكم في عالمنا ✨</h1>
    <button class="play-btn" onclick="startGame()">هيا نلعب 🎮</button>
  </div>

  <!-- شاشة لعبة الطائرة -->
  <div id="game-screen">
    <div class="game-ui">
      <div>الجولة: <span id="round-num">1</span></div>
      <div>الرصيد: <span id="balance-num">100</span> نقطة</div>
      
      <div class="audio-controls">
        🔊 <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div class="canvas-container">
      <div class="status-msg" id="status-msg"></div>
      <div class="multiplier-display" id="multiplier">1.00x</div>
      <div class="plane" id="plane">🚀</div>
    </div>

    <div class="controls-panel">
      <button class="action-btn btn-start" id="start-btn" onclick="startFlight()">إقلاع 🚀</button>
      <button class="action-btn btn-cashout" id="cashout-btn" onclick="cashOut()">سحب الأرباح 💰</button>
    </div>
  </div>

  <script>
    // --- 1. تساقط القلوب ---
    const colors = ['#ff4b5c', '#ff75a0', '#ce93d8', '#ffb74d', '#4dd0e1', '#81c784', '#ff4081'];
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerHTML = '❤️';
      heart.style.left = Math.random() * 100 + 'vw';
      const size = Math.random() * 20 + 15;
      heart.style.fontSize = size + 'px';
      heart.style.color = colors[Math.floor(Math.random() * colors.length)];
      const duration = Math.random() * 3 + 2;
      heart.style.animationDuration = duration + 's';
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), duration * 1000);
    }
    setInterval(createHeart, 250);

    // --- 2. نظام الصوت والموسيقى ---
    let audioCtx;
    let masterGain;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.5;
      masterGain.connect(audioCtx.destination);
    }

    function playBeep(freq, type = 'sine', duration = 0.1) {
      if (!audioCtx) return;
      let osc = audioCtx.createOscillator();
      let gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(masterGain);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    document.getElementById('volume-slider').addEventListener('input', (e) => {
      if (masterGain) masterGain.gain.value = e.target.value;
    });

    // --- 3. منطق لعبة الطائرة ---
    let balance = 100;
    let round = 1;
    let multiplier = 1.00;
    let crashPoint = 0;
    let flightInterval;
    let isFlying = false;

    const multiplierEl = document.getElementById('multiplier');
    const planeEl = document.getElementById('plane');
    const startBtn = document.getElementById('start-btn');
    const cashoutBtn = document.getElementById('cashout-btn');
    const statusMsg = document.getElementById('status-msg');

    function startGame() {
      document.getElementById('welcome-screen').style.display = 'none';
      document.getElementById('game-screen').style.display = 'block';
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function startFlight() {
      if (isFlying) return;

      isFlying = true;
      multiplier = 1.00;
      statusMsg.innerText = '';
      multiplierEl.style.color = '#38bdf8';
      
      // اختيار نقطة الانهيار بشكل عشوائي (تزداد صعوبة وتنوع)
      crashPoint = (Math.random() * 5 + 1.1).toFixed(2); 

      startBtn.style.display = 'none';
      cashoutBtn.style.display = 'inline-block';
      cashoutBtn.disabled = false;

      // ضبط موقع الطائرة للبداية
      planeEl.style.bottom = '20px';
      planeEl.style.left = '20px';
      planeEl.style.opacity = '1';

      flightInterval = setInterval(() => {
        multiplier += 0.03 + (multiplier * 0.01); // تسارع العداد
        multiplierEl.innerText = multiplier.toFixed(2) + 'x';

        // تحريك الطائرة نحو الأعلى واليمين
        let progress = (multiplier - 1) / 5;
        planeEl.style.bottom = Math.min(80, 20 + progress * 60) + '%';
        planeEl.style.left = Math.min(80, 20 + progress * 60) + '%';

        playBeep(200 + (multiplier * 50), 'sine', 0.05);

        // تحقق من الانهيار / طيران الطائرة بعيداً
        if (multiplier >= crashPoint) {
          crash();
        }
      }, 100);
    }

    function cashOut() {
      if (!isFlying) return;
      clearInterval(flightInterval);
      isFlying = false;

      let won = Math.floor(10 * multiplier);
      balance += won;
      document.getElementById('balance-num').innerText = balance;

      statusMsg.style.color = '#10b981';
      statusMsg.innerText = `فزت بـ ${won} نقطة! 🎉`;
      playBeep(880, 'triangle', 0.3);

      endRound();
    }

    function crash() {
      clearInterval(flightInterval);
      isFlying = false;

      multiplierEl.style.color = '#ef4444';
      statusMsg.style.color = '#ef4444';
      statusMsg.innerText = 'طارت الطائرة! 💥 خسرت الجولة';
      
      // أنيميشن طيران الطائرة بعيداً
      planeEl.style.left = '120%';
      planeEl.style.bottom = '120%';
      planeEl.style.opacity = '0';

      playBeep(120, 'sawtooth', 0.4);

      endRound();
    }

    function endRound() {
      cashoutBtn.style.display = 'none';
      startBtn.style.display = 'inline-block';
      round++;
      document.getElementById('round-num').innerText = round;
    }
  </script>
</body>
</html>
